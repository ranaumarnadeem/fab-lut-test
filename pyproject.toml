[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fabtest"
version = "0.1.0"
description = "Configuration-based manufacturing test generation for FABulous eFPGA fabrics"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy", "pybind11"]

[project.optional-dependencies]
sat = ["python-sat>=1.8.dev0"]   # fabtest untestable
pack = ["ortools"]               # fabtest pack (CP-SAT; greedy without it)

[project.scripts]
fabtest = "fabtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fabtest = ["suites/*.toml", "synth/*.ys.in", "synth/*.v", "sim/fastsim/*.c", "native/*.cpp"]
